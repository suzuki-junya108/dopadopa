id = "dopadopa.board"
name = "dopadopa"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Claude Code の複数セッションをブラウザのライブボードで見渡す"
platforms = ["macos", "linux"]

# herdr サーバー起動時に一度だけ走る。ブリッジ（常駐プロセス）を切り離して起動して終了する。
[[startup]]
command = ["sh", "bin/start-bridge.sh"]

[[actions]]
id = "open"
title = "dopadopa: ボードを開く"
contexts = ["workspace"]
command = ["sh", "bin/open-board.sh"]

[[actions]]
id = "install-hooks"
title = "dopadopa: Claude Code のフックを入れる"
contexts = ["workspace"]
command = ["node", "bin/install-hooks.js"]

[[actions]]
id = "restart"
title = "dopadopa: ブリッジを再起動"
contexts = ["workspace"]
command = ["sh", "bin/start-bridge.sh", "--restart"]

[[actions]]
id = "stop"
title = "dopadopa: ブリッジを停止"
contexts = ["workspace"]
command = ["sh", "bin/start-bridge.sh", "--stop"]
